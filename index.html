<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Piku</title>
<meta name="description" content="A little library of love, written for you.">
<meta property="og:title" content="Happy Birthday, Piku">
<meta property="og:description" content="A little library of love, written for you.">
<meta name="theme-color" content="#1B0C17">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌹</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Pinyon+Script&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1B0C17; --wine:#4E1222; --wine-deep:#2C0B19;
  --gilt:#D9B26A; --gilt-soft:#F0DCAE; --gilt-dim:rgba(217,178,106,.42);
  --petal:#E46F82; --petal-soft:#F7BFC8;
  --paper:#FAEDE8; --paper-edge:#EBD3CB; --ink:#2A1420; --ink-soft:#6A4450;
  --text:#F6E7E1; --text-dim:#CFB4B1;
  --serif:'IM Fell English','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --script:'Pinyon Script','Snell Roundhand','Apple Chancery','Segoe Script',cursive;
  --deva:'Tiro Devanagari Hindi','Noto Serif Devanagari','Kohinoor Devanagari','Nirmala UI','Mangal',serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme:dark; --night:#170A14; --wine-deep:#280A16; }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--night);color:var(--text);font-family:var(--serif);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gilt);outline-offset:4px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.sprite{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- layers ---------- */
#backdrop{position:fixed;inset:0;z-index:0;background:var(--night);transition:background-color .6s}
#backdrop::after{content:'';position:absolute;inset:0;opacity:0;pointer-events:none}
#sky{position:fixed;inset:0;z-index:1;pointer-events:none;width:100%;height:100%}
#petals{position:fixed;inset:0;z-index:30;pointer-events:none;width:100%;height:100%}
body.reading-room #petals{z-index:5}
main{position:relative;z-index:10}
#veil{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;overflow:hidden;transition:opacity .8s ease}
#veil.on{opacity:1;pointer-events:auto}
#veil.dark{background:var(--night)}
#veil .flood{position:absolute;left:var(--x,50%);top:var(--y,50%);width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;
  background:radial-gradient(circle,#FFF7E4 0%,#F8D9A4 38%,#E9A877 66%,rgba(233,168,119,0) 72%);transform:scale(0);opacity:1}
#veil.flooding .flood{transform:scale(230);transition:transform 1.05s cubic-bezier(.55,0,.35,1)}
#veil.dark .flood{opacity:0}

body[data-room=hero] #backdrop{background:radial-gradient(120% 85% at 50% 42%,#5B1529 0%,#320C1C 46%,var(--night) 100%)}
body[data-room=hall] #backdrop{background:radial-gradient(110% 55% at 50% 0%,#3B1526 0%,var(--night) 72%)}
body[data-room=act1] #backdrop{background:linear-gradient(#0E0A1D,#1C1030 62%,#28122F)}
body[data-room=act2] #backdrop{background:linear-gradient(#1A0F2B,#2B1434)}
body[data-room=act2] #backdrop::after{background:linear-gradient(#2E173A 0%,#6A2F45 55%,#9A4E55 100%);opacity:var(--dawn,0)}
body[data-room=act3] #backdrop{background:radial-gradient(120% 80% at 50% 0%,#1D1A49 0%,#0C0B23 72%)}
body[data-room=act4] #backdrop{background:radial-gradient(95% 70% at 50% 28%,#5A2A18 0%,#2B110D 58%,#170907 100%)}
body[data-room=birds] #backdrop{background:linear-gradient(#2F1431,#241024 50%,#180A16)}
body[data-room=letter] #backdrop{background:radial-gradient(90% 70% at 50% 35%,#3B1A15 0%,#1B0B0A 76%)}
body[data-room=finale] #backdrop{background:radial-gradient(60% 50% at 50% 50%,#3A170F 0%,#120708 78%)}

.room:not(.is-active){display:none!important}

/* ---------- buttons & chrome ---------- */
.btn{appearance:none;-webkit-appearance:none;font-family:var(--serif);font-size:1.12rem;line-height:1.2;color:var(--gilt-soft);
  background:rgba(78,18,34,.6);border:1px solid var(--gilt-dim);border-radius:999px;padding:.85em 1.9em;cursor:pointer;
  box-shadow:0 0 0 4px rgba(217,178,106,.07),0 12px 30px -12px rgba(0,0,0,.7);transition:background-color .3s,transform .2s}
.btn:hover{background:rgba(112,30,50,.75)}
.btn:active{transform:scale(.97)}
.btn.quiet{background:transparent;box-shadow:none}
.btn-row{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center}

.chrome{position:fixed;z-index:50;top:calc(.85rem + var(--safe-t));display:none;align-items:center;gap:.45rem;
  appearance:none;-webkit-appearance:none;font-family:var(--serif);font-size:1rem;color:var(--gilt-soft);cursor:pointer;
  background:rgba(27,12,23,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid var(--gilt-dim);border-radius:999px;padding:.5em 1em .5em .8em;min-height:44px}
.chrome svg{width:18px;height:18px;flex:none}
#backBtn{left:calc(.85rem + env(safe-area-inset-left,0px))}
#soundBtn{right:calc(.85rem + env(safe-area-inset-right,0px));padding:.5em;width:44px;justify-content:center}
body.in-room #backBtn{display:inline-flex}
body.has-music:not([data-room=hero]) #soundBtn{display:inline-flex}
#soundBtn[aria-pressed=false] .waves{opacity:0}

#ribbon{position:fixed;top:0;right:0;width:3px;height:100%;z-index:45;transform-origin:top;transform:scaleY(var(--p,0));
  background:linear-gradient(var(--gilt),var(--petal));display:none;pointer-events:none}
body.reading-room #ribbon{display:block}

#toast{position:fixed;z-index:55;left:50%;bottom:calc(1.4rem + var(--safe-b));transform:translate(-50%,16px);opacity:0;
  max-width:min(90vw,26rem);text-align:center;font-style:italic;font-size:1.05rem;line-height:1.35;color:var(--gilt-soft);
  background:rgba(27,12,23,.85);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--gilt-dim);
  border-radius:14px;padding:.8em 1.2em;pointer-events:none;transition:opacity .4s,transform .4s}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- hero ---------- */
.hero{min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;
  padding:calc(2rem + var(--safe-t)) 1.25rem calc(2.5rem + var(--safe-b))}
.hero-inner{max-width:44rem}
.rosette{width:54px;height:54px;color:var(--gilt);opacity:0;transition:opacity 1.6s .2s}
.hb{font-family:var(--script);font-weight:400;margin:.2rem 0 0;line-height:.92;font-size:clamp(3.5rem,15.5vw,8.6rem)}
.hb .w{display:block;padding:.08em .2em .14em;
  -webkit-mask-image:linear-gradient(90deg,#000 44%,transparent 56%);mask-image:linear-gradient(90deg,#000 44%,transparent 56%);
  -webkit-mask-size:250% 100%;mask-size:250% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:100% 0;mask-position:100% 0}
.hb .w>span{display:inline-block;padding:.14em .32em .26em;
  background:linear-gradient(100deg,#F6E4BA 0%,#D9B26A 36%,#F6C5CD 60%,#E3BE77 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.hb .w2{font-size:1.22em;margin-top:-.18em}
.hero-sub{font-style:italic;font-size:clamp(1.12rem,4.4vw,1.4rem);color:var(--text-dim);margin:1.1rem auto 2.2rem;max-width:22em;opacity:0;transition:opacity 1.4s}
.hero .btn{opacity:0;transform:translateY(6px);transition:opacity 1.2s,transform 1.2s,background-color .3s}
.hero.is-written .rosette{opacity:.9}
.hero.is-written .w1{animation:write 2.1s cubic-bezier(.45,0,.3,1) .4s forwards}
.hero.is-written .w2{animation:write 1.6s cubic-bezier(.45,0,.3,1) 2.2s forwards}
.hero.is-written .hero-sub{opacity:1;transition-delay:3.6s}
.hero.is-written .btn{opacity:1;transform:none;transition-delay:4.3s,4.3s,0s}
@keyframes write{to{-webkit-mask-position:0 0;mask-position:0 0}}

/* ---------- hall ---------- */
.hall{padding-bottom:calc(4rem + var(--safe-b))}
.shelf{position:relative;display:flex;align-items:flex-end;gap:2px;height:calc(104px + var(--safe-t));padding-top:var(--safe-t);
  overflow:hidden;background:linear-gradient(#10060E,#1E0C17)}
.shelf::after{content:'';position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(#3C1B12,#20100A);
  border-top:1px solid var(--gilt-dim);box-shadow:0 8px 18px rgba(0,0,0,.55)}
.spine{flex:none;margin-bottom:12px;border-radius:2px 2px 0 0;
  background-image:linear-gradient(to bottom,transparent 13%,rgba(217,178,106,.55) 13% 15%,transparent 15% 81%,rgba(217,178,106,.55) 81% 83%,transparent 83%);
  box-shadow:inset -3px 0 4px rgba(0,0,0,.35),inset 1px 0 0 rgba(255,255,255,.07)}
.spine.lean{transform:rotate(-7deg);transform-origin:bottom left;margin-left:6px}
.hall-head{text-align:center;padding:3rem 1.5rem 2.6rem;max-width:40rem;margin:0 auto}
.fleuron{display:block;width:120px;height:20px;margin:0 auto;color:var(--gilt)}
.hall-title{font-weight:400;font-size:clamp(2.05rem,8vw,3.5rem);line-height:1.08;margin:1rem 0 .9rem;color:var(--gilt-soft);text-wrap:balance}
.hall-sub{font-style:italic;color:var(--text-dim);font-size:clamp(1.08rem,4vw,1.25rem);line-height:1.45;margin:0 auto;max-width:24em}

.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2.6rem 1.5rem;max-width:30rem;margin:0 auto;padding:0 1.6rem}
@media (min-width:860px){.doors{grid-template-columns:repeat(4,minmax(0,1fr));max-width:62rem;gap:2.4rem}}
.door{appearance:none;-webkit-appearance:none;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1.05rem;text-align:center}
.door-frame{position:relative;width:100%;aspect-ratio:5/9;border-radius:50% 50% 5px 5px / 27.8% 27.8% 5px 5px;perspective:900px;
  background:radial-gradient(70% 55% at 50% 72%,#FFEFC9 0%,#F2BE7E 32%,#9A4A2E 70%,#4A1A14 100%);
  box-shadow:0 0 0 5px #24101A,0 0 0 6px var(--gilt-dim),0 26px 40px -16px rgba(0,0,0,.75)}
.door-frame::after{content:'';position:absolute;left:4%;right:4%;bottom:-16px;height:22px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,214,150,.75),rgba(255,180,110,.25) 60%,transparent);opacity:0;transition:opacity 1s;pointer-events:none}
.door-leaf{position:absolute;inset:0;border-radius:inherit;transform-origin:0 50%;transform:rotateY(0);
  transition:transform 1.25s cubic-bezier(.62,.04,.2,1),filter .6s;will-change:transform;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px),
    linear-gradient(90deg,#3B0E1B 0%,#5A1727 18%,#481120 50%,#5B1828 82%,#380C18 100%);
  box-shadow:inset 0 0 0 1px rgba(217,178,106,.42),inset 0 0 26px rgba(0,0,0,.5)}
.door-leaf .pnl{position:absolute;left:15%;right:15%;border:1px solid rgba(217,178,106,.48);box-shadow:inset 0 0 12px rgba(0,0,0,.45),0 0 0 3px rgba(0,0,0,.12)}
.door-leaf .pnl.t{top:10%;height:39%;border-radius:50% 50% 3px 3px / 32% 32% 3px 3px;display:grid;place-items:end center;padding-bottom:12%}
.door-leaf .pnl.b{top:55%;bottom:8%;border-radius:3px}
.numeral{font-size:clamp(1.7rem,7vw,2.5rem);line-height:1;color:var(--gilt);text-shadow:0 1px 0 rgba(0,0,0,.5)}
.knob{position:absolute;right:9%;top:51%;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FBE7B5,#B88A3E 60%,#6E4E1C);box-shadow:0 1px 2px rgba(0,0,0,.6)}
.lock{position:absolute;right:calc(9% - 5px);top:calc(51% + 14px);width:18px;height:18px;color:var(--gilt);opacity:0;transition:opacity .4s}
.door-plaque{font-style:italic;font-size:clamp(.98rem,3.6vw,1.1rem);line-height:1.3;color:var(--gilt-soft);max-width:12em;text-wrap:balance;transition:color .4s}
.door.is-locked .door-leaf{filter:brightness(.62) saturate(.7)}
.door.is-locked .lock{opacity:.85}
.door.is-locked .door-plaque{color:var(--text-dim)}
.door.is-read .door-leaf{transform:rotateY(-24deg)}
.door.is-next .door-frame::after{opacity:1;animation:breathe 3.2s ease-in-out infinite}
.door.is-opening .door-leaf{transform:rotateY(-106deg)!important;filter:none}
.door.just-unlocked .door-frame::after{animation:flare 1.8s ease-out,breathe 3.2s 1.8s ease-in-out infinite}
.door.nudge .door-leaf{animation:nudge .45s}
@media (hover:hover){.door.is-next:hover .door-leaf,.door.is-read:hover .door-leaf{transform:rotateY(-32deg)}}
.door:focus-visible{outline:none}
.door:focus-visible .door-frame{outline:2px solid var(--gilt);outline-offset:10px}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes flare{0%{opacity:0;transform:scaleX(.3)}40%{opacity:1;transform:scaleX(1.25)}100%{opacity:.8;transform:none}}
@keyframes nudge{0%,100%{transform:rotateY(0)}30%{transform:rotateY(-5deg)}60%{transform:rotateY(2deg)}}

.nooks{display:grid;gap:3rem;max-width:30rem;margin:4rem auto 0;padding:0 1.6rem}
@media (min-width:860px){.nooks{grid-template-columns:1fr 1fr;max-width:54rem;gap:3rem;align-items:start}}
.nook{appearance:none;-webkit-appearance:none;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1.05rem;text-align:center}
.nook-art{position:relative;display:block;width:100%;transition:filter .6s}
.window-art{aspect-ratio:400/260;border-radius:50% 50% 8px 8px / 76% 76% 8px 8px;overflow:hidden;
  box-shadow:0 0 0 5px #24101A,0 0 0 6px var(--gilt-dim),0 26px 40px -16px rgba(0,0,0,.75)}
.window-art svg{display:block;width:100%;height:100%}
.window-art::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent calc(50% - 1.5px),rgba(36,16,26,.9) calc(50% - 1.5px) calc(50% + 1.5px),transparent calc(50% + 1.5px)),
    linear-gradient(transparent calc(58% - 1.5px),rgba(36,16,26,.9) calc(58% - 1.5px) calc(58% + 1.5px),transparent calc(58% + 1.5px)),
    linear-gradient(125deg,rgba(255,255,255,.1),transparent 40%)}
.desk-art{aspect-ratio:400/260;display:grid;place-items:center;border-radius:10px;
  background:radial-gradient(80% 70% at 50% 45%,#4A2418,#25110C 80%);box-shadow:0 0 0 1px var(--gilt-dim),0 26px 40px -16px rgba(0,0,0,.75)}
.desk-art svg{width:62%;height:auto;filter:drop-shadow(0 14px 16px rgba(0,0,0,.55))}
.nook-title{font-size:clamp(1.25rem,4.8vw,1.45rem);line-height:1.3;color:var(--gilt-soft)}
.nook-title[lang=hi]{font-family:var(--deva);font-size:clamp(1.25rem,4.8vw,1.45rem)}
.nook-note{font-style:italic;font-size:1rem;color:var(--text-dim);margin-top:-.6rem}
.nook.is-locked .nook-art{filter:brightness(.45) saturate(.55)}
.nook.is-next .nook-art{animation:glowpulse 3.2s ease-in-out infinite}
.nook.just-unlocked .nook-art{animation:unveil 1.6s ease-out,glowpulse 3.2s 1.6s ease-in-out infinite}
.nook.nudge .nook-art{animation:shake .45s}
.nook:focus-visible{outline:none}
.nook:focus-visible .nook-art{outline:2px solid var(--gilt);outline-offset:10px}
@keyframes glowpulse{0%,100%{filter:drop-shadow(0 0 0 rgba(255,200,130,0))}50%{filter:drop-shadow(0 0 18px rgba(255,200,130,.35))}}
@keyframes unveil{from{filter:brightness(.45) saturate(.55)}to{filter:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}60%{transform:translateX(4px)}}

/* ---------- reading rooms ---------- */
.reading{padding:calc(5.5rem + var(--safe-t)) 1.35rem calc(5rem + var(--safe-b))}
.room-head{text-align:center;margin:0 auto 3.4rem;max-width:34rem}
.room-numeral{display:block;font-size:clamp(4.6rem,21vw,7.6rem);line-height:1;color:var(--gilt);opacity:.92}
.room-title{font-weight:400;font-style:italic;font-size:clamp(1.6rem,6.4vw,2.5rem);line-height:1.2;margin:.5rem 0 0;color:var(--gilt-soft);text-wrap:balance}
.poem{max-width:31rem;margin:0 auto;font-size:clamp(1.14rem,4.35vw,1.32rem);line-height:1.74}
.stanza{margin:0 0 1.9em}
.ln{margin:0;padding-left:1.1em;text-indent:-1.1em}
.stanza .ln+.ln{padding-left:2.2em}
.solo{margin:3.2em auto;text-align:center;font-style:italic;font-size:1.3em;line-height:1.48;color:var(--gilt-soft);max-width:22em}
.solo .ln,.solo .ln+.ln{padding-left:0;text-indent:0}
.solo .ln+.ln{margin-top:.35em}
.moment{min-height:72vh;min-height:72svh;display:grid;place-items:center;margin:2em 0;text-align:center}
.moment .ln{padding:0;text-indent:0;font-family:var(--script);font-size:clamp(2.9rem,12.5vw,5.4rem);line-height:1.15;color:var(--gilt-soft);
  text-shadow:0 0 28px rgba(246,197,205,.25)}
.moment .ch{display:inline-block;opacity:0;filter:blur(8px);transition:opacity 1s,filter 1.2s;transition-delay:calc(var(--i)*70ms)}
.moment.is-in .ch{opacity:1;filter:none}
.closing-st{text-align:center;font-size:1.18em;margin-top:3em}
.closing-st .ln,.closing-st .ln+.ln{padding-left:0;text-indent:0}
.closing-st .ln:last-child{color:var(--gilt-soft);font-style:italic;font-size:1.22em;margin-top:.3em;text-shadow:0 0 22px rgba(240,220,174,.45)}

/* ink reveal: words settle like ink drying, line by line */
.reveal .ln{opacity:0;filter:blur(5px);transition:opacity 1s ease,filter 1.2s ease;transition-delay:calc(var(--i,0)*150ms)}
.reveal.is-in .ln{opacity:1;filter:none}

.dict{background:var(--paper);color:var(--ink);max-width:21rem;margin:0 auto 3.6rem;padding:1.35rem 1.6rem 1.25rem;border-radius:3px;
  box-shadow:inset 0 0 0 1px var(--paper-edge),0 22px 40px -18px rgba(0,0,0,.8);transform:rotate(-1.3deg)}
.dict-word{font-size:2rem;line-height:1.1;margin:0}
.dict-meta{font-size:1.02rem;color:var(--ink-soft);margin:.15rem 0 0}
.dict-meta i{margin-left:.35em}
.dict-defs{margin:.8rem 0 .5rem;padding-left:1.5rem;font-size:1.14rem;line-height:1.6}
.dict-defs span{position:relative}
.dict-defs span::after{content:'';position:absolute;left:-3%;top:56%;height:1.6px;width:0;background:#B8324F;transition:width .55s ease;transition-delay:calc(.7s + var(--i)*.6s)}
.dict.is-in .dict-defs span::after{width:106%}
.dict-none{font-style:italic;color:#8E2A45;margin:.4rem 0 0;font-size:1.06rem;opacity:0;transition:opacity 1s 3.4s}
.dict.is-in .dict-none{opacity:1}

.art{display:block;margin:0 auto 2.8rem;color:var(--gilt)}
.art path,.art line,.art ellipse{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2.6s ease}
.art.is-in path,.art.is-in line,.art.is-in ellipse{stroke-dashoffset:0}
.trees{width:min(100%,20rem)}

.room-end{text-align:center;margin:4rem auto 0;max-width:30rem}
.room-end .fleuron{margin-bottom:2rem}
.end-note{font-style:italic;color:var(--text-dim);margin:0 0 1.4rem;font-size:1.06rem}

/* birds room */
.scene-wrap{max-width:38rem;margin:0 auto 2.4rem;border-radius:50% 50% 10px 10px / 70% 70% 10px 10px;overflow:hidden;
  box-shadow:0 0 0 5px #24101A,0 0 0 6px var(--gilt-dim),0 30px 50px -20px rgba(0,0,0,.8)}
.scene-wrap svg{display:block;width:100%;height:auto}
.poem.hi,.room-title.hi{font-family:var(--deva);font-style:normal}
.poem.hi{font-size:clamp(1.1rem,4.25vw,1.28rem);line-height:2}
.room-title.hi{font-size:clamp(1.65rem,6.6vw,2.4rem);line-height:1.45}
.speech{color:var(--petal-soft)}
.branch-art{width:min(100%,15rem);margin:.4rem auto 2.6rem;display:block}
.bird{transform-box:fill-box;transform-origin:50% 100%}
.bird.bob{animation:bob 5s ease-in-out infinite}
.bird.bob.b2{animation-delay:-2.3s}
@keyframes bob{0%,100%{transform:none}48%{transform:translateY(0)}55%{transform:translateY(-1.5px) rotate(-2deg)}62%{transform:none}}

/* letter */
.letter-room{padding:calc(5.5rem + var(--safe-t)) 1.2rem calc(5rem + var(--safe-b))}
.env-stage{min-height:calc(100vh - 11rem);min-height:calc(100svh - 11rem);display:grid;place-items:center;align-content:center;gap:1.6rem;text-align:center}
.env-stage.gone{display:none}
.envelope{position:relative;width:min(84vw,24rem);aspect-ratio:3/2;perspective:1000px}
.env-back{position:absolute;inset:0;border-radius:6px;background:#D9B8AA;box-shadow:0 26px 44px -18px rgba(0,0,0,.8)}
.env-sheet{position:absolute;left:7%;right:7%;top:7%;height:82%;border-radius:3px;background:var(--paper);
  background-image:repeating-linear-gradient(transparent 0 14px,rgba(106,68,80,.12) 14px 15px);background-position:0 30%;
  transition:transform 1.1s cubic-bezier(.4,0,.2,1);z-index:2}
.env-l,.env-r,.env-bt{position:absolute;inset:0;border-radius:6px;z-index:3}
.env-l{background:#EBD2C7;clip-path:polygon(0 0,52% 55%,0 100%)}
.env-r{background:#E6CBBF;clip-path:polygon(100% 0,48% 55%,100% 100%)}
.env-bt{background:#F0DBD1;clip-path:polygon(0 100%,50% 47%,100% 100%)}
.env-flap{position:absolute;left:0;right:0;top:0;height:60%;z-index:4;background:#E2C1B4;clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:50% 0;transition:transform .9s cubic-bezier(.4,0,.2,1);border-radius:6px 6px 0 0}
.seal{position:absolute;left:50%;top:60%;z-index:6;width:68px;height:68px;transform:translate(-50%,-50%);cursor:pointer;
  appearance:none;-webkit-appearance:none;border:0;padding:0;background:none;transition:transform .6s,opacity .6s}
.seal::before{content:'';position:absolute;inset:0;border-radius:47% 53% 50% 50% / 52% 46% 54% 48%;
  background:radial-gradient(circle at 36% 30%,#D0425C,#951932 58%,#6C1024);box-shadow:0 4px 8px rgba(0,0,0,.45)}
.seal::after{content:'';position:absolute;inset:8px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(60,6,18,.35),inset 0 0 0 4px rgba(255,255,255,.06)}
.seal span{position:relative;z-index:1;font-family:var(--script);font-size:2.3rem;line-height:68px;color:#5C0A1C;text-shadow:0 1px 0 rgba(255,180,190,.28)}
.seal:focus-visible{outline:2px solid var(--gilt);outline-offset:6px;border-radius:50%}
.env-hint{font-style:italic;color:var(--text-dim);font-size:1.1rem;margin:0;transition:opacity .5s}
.envelope.open+.env-hint{opacity:0}
.envelope.open .seal{transform:translate(-50%,-50%) scale(1.4) rotate(10deg);opacity:0;pointer-events:none}
.envelope.open .env-flap{transform:rotateX(180deg);transition-delay:.35s}
.envelope.flap-back .env-flap{z-index:1}
.envelope.rise .env-sheet{transform:translateY(-62%)}

.letter-paper{display:none;max-width:36rem;margin:0 auto;color:var(--ink);border-radius:4px;
  padding:clamp(2.2rem,8vw,3.6rem) clamp(1.45rem,6.5vw,3.3rem) clamp(2.4rem,8vw,3.6rem);
  background:
    linear-gradient(transparent calc(33.3% - 1px),rgba(106,68,80,.09) 33.3%,transparent calc(33.3% + 1px)),
    linear-gradient(transparent calc(66.6% - 1px),rgba(106,68,80,.09) 66.6%,transparent calc(66.6% + 1px)),
    radial-gradient(130% 80% at 50% 0%,#FEF6F2,var(--paper));
  box-shadow:inset 0 0 0 1px var(--paper-edge),0 34px 60px -26px rgba(0,0,0,.85)}
.letter-paper.shown{display:block;animation:paperIn 1.1s cubic-bezier(.3,0,.2,1)}
@keyframes paperIn{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
.letter-title{font-family:var(--script);font-weight:400;font-size:clamp(2.5rem,10.5vw,3.7rem);line-height:1.08;color:var(--wine);text-align:center;margin:0 0 1.8rem}
.letter-paper p{font-size:clamp(1.1rem,4.25vw,1.24rem);line-height:1.76;margin:0 0 1.15em}
.letter-paper .reveal{opacity:0;filter:blur(4px);transition:opacity 1.1s,filter 1.2s}
.letter-paper .reveal.is-in{opacity:1;filter:none}
.letter-close{font-family:var(--script);color:var(--wine);text-align:center;margin-top:2.2rem!important;line-height:1.3!important;font-size:clamp(1.9rem,7.6vw,2.6rem)!important}
.letter-close .sub{display:block;font-size:.8em}
.heart{display:inline-block;width:.72em;height:.72em;vertical-align:-.04em;fill:var(--petal);margin-left:.15em}
.letter-title .heart{width:.5em;height:.5em}
.letter-end{text-align:center;margin:3.2rem auto 0;display:none}
.letter-end.shown{display:block}

/* finale */
.finale{min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;padding:calc(4.5rem + var(--safe-t)) 1.4rem calc(3rem + var(--safe-b))}
.candle{position:relative;display:block;width:140px;height:290px;margin:0 auto;appearance:none;-webkit-appearance:none;background:none;border:0;padding:0;cursor:pointer}
.candle:focus-visible{outline:none}
.candle:focus-visible .wax{outline:2px solid var(--gilt);outline-offset:8px}
.halo{position:absolute;left:50%;top:62px;width:560px;height:560px;transform:translate(-50%,-50%);pointer-events:none;border-radius:50%;
  background:radial-gradient(circle,rgba(255,206,130,.34) 0%,rgba(255,160,90,.12) 32%,transparent 64%);transition:opacity 1.4s;animation:halo 3s ease-in-out infinite}
.flame{position:absolute;left:50%;top:30px;width:24px;height:50px;margin-left:-12px;transform-origin:50% 92%;
  border-radius:50% 50% 50% 50% / 64% 64% 36% 36%;
  background:radial-gradient(ellipse 50% 60% at 50% 72%,#FFFFFF 0%,#FFF0BC 28%,#FFBE55 56%,rgba(255,120,40,0) 78%);
  animation:flicker 1.7s ease-in-out infinite;transition:opacity .35s,transform .35s}
.flame::before{content:'';position:absolute;left:50%;bottom:6px;width:9px;height:12px;margin-left:-4.5px;border-radius:50%;background:radial-gradient(#5D8BFF,rgba(93,139,255,0) 70%);opacity:.7}
.wick{position:absolute;left:50%;top:72px;width:2px;height:12px;margin-left:-1px;background:#2A1A12;border-radius:1px}
.wax{position:absolute;left:50%;top:82px;width:36px;height:150px;margin-left:-18px;border-radius:7px 7px 2px 2px;
  background:linear-gradient(90deg,#E6D6C2,#FFF8EE 42%,#EFE2D0 70%,#D8C5AE)}
.wax::before{content:'';position:absolute;left:6px;top:-1px;width:9px;height:26px;border-radius:0 0 6px 6px;background:linear-gradient(90deg,#F3E7D6,#FFFAF2)}
.holder{position:absolute;left:50%;top:228px;width:104px;height:24px;margin-left:-52px;border-radius:50%;
  background:linear-gradient(#F0D18E,#A87A38 70%,#6E4C1E);box-shadow:0 10px 18px -6px rgba(0,0,0,.7)}
.holder::after{content:'';position:absolute;left:50%;top:14px;width:30px;height:40px;margin-left:-15px;border-radius:0 0 40% 40%;background:linear-gradient(90deg,#7A5523,#E6C27C 45%,#8C6328)}
.smoke{position:absolute;left:50%;top:58px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:rgba(230,220,210,.35);filter:blur(4px);opacity:0}
.candle.out .flame{opacity:0;transform:scaleY(.2) translateY(14px)}
.candle.out .halo{opacity:0}
.candle.out .smoke{animation:smoke 2.6s ease-out forwards}
.candle.out .smoke:nth-child(2){animation-delay:.25s}
.candle.out .smoke:nth-child(3){animation-delay:.5s}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(1.03,.96) rotate(-2deg)}50%{transform:scale(.97,1.05) rotate(1.5deg)}75%{transform:scale(1.02,.98) rotate(-1deg)}}
@keyframes halo{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes smoke{0%{opacity:.7;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(14px,-120px) scale(4)}}
.finale-prompt{font-style:italic;color:var(--text-dim);font-size:clamp(1.1rem,4.2vw,1.3rem);margin:2.2rem 0 0;transition:opacity .6s}
.finale-msg{display:none;margin-top:1.6rem}
.finale-msg.shown{display:block;animation:paperIn 1.4s cubic-bezier(.3,0,.2,1)}
.finale-hb{font-family:var(--script);font-weight:400;font-size:clamp(3rem,13vw,6rem);line-height:1;margin:0;
  background:linear-gradient(100deg,#F6E4BA,#D9B26A 40%,#F6C5CD 65%,#E3BE77);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding:.1em .3em .2em}
.finale-line{font-style:italic;color:var(--text);font-size:clamp(1.15rem,4.4vw,1.4rem);margin:.6rem 0 2.2rem}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
  .hb .w{-webkit-mask-position:0 0;mask-position:0 0}
}

h2[tabindex="-1"]:focus,h1[tabindex="-1"]:focus{outline:none}
#veil.dark{transition-duration:.45s}
.poem.hi .solo{font-style:normal}
</style>

 "letter": {

<script>
(() => {
'use strict';

/* ================= setup ================= */
const C = JSON.parse(document.getElementById('content').textContent);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const body = document.body;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, reduced ? Math.min(ms, 60) : ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const HEART = '<svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><use href="#heartS"/></svg>';
const heartify = s => esc(String(s).replace(/\s*\u2764\uFE0F?/g, ' @@H@@')).replace(/ @@H@@/g, '&nbsp;' + HEART);

const ORDER = ['act1', 'act2', 'act3', 'act4', 'birds', 'letter'];
const ROMAN = ['I', 'II', 'III', 'IV'];
const DENSITY = { hero: 1, hall: .35, act1: 0, act2: 0, act3: 0, act4: .22, birds: 0, letter: .25, finale: .55 };
const LOCK_MSG = {
  act2: 'Read Act I first. This door opens after it.',
  act3: 'Read Act II first. This door opens after it.',
  act4: 'Read Act III first. This door opens after it.',
  birds: 'The window opens after the fourth door.',
  letter: 'The letter opens after the story of the two birds.'
};
const UNLOCK_MSG = {
  act2: 'Door II is open now.', act3: 'Door III is open now.', act4: 'Door IV is open now.',
  birds: 'The window is open now.', letter: 'The letter is ready for you.'
};

/* ================= progress ================= */
const KEY = 'pikuLibrary.v1';
const params = new URLSearchParams(location.search);
if (params.has('reset')) { try { localStorage.removeItem(KEY); } catch (e) {} }
const preview = params.has('preview');
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { done = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} };
const unlocked = id => { const i = ORDER.indexOf(id); return i <= 0 || preview || !!done[ORDER[i - 1]]; };

/* ================= rendering ================= */
const FLEURON = '<svg class="fleuron" aria-hidden="true"><use href="#fleuronS"/></svg>';

const TREES = `<svg class="art trees" viewBox="0 0 320 190" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path pathLength="1" d="M18 112H302" stroke-opacity=".45"/>
  <path pathLength="1" d="M88 112V68M88 86 75 74M88 80l13-12"/>
  <path pathLength="1" d="M88 72c-22 2-38-10-34-26 3-14 16-18 24-14 2-12 18-18 28-8 12-6 26 4 22 18 10 8 4 26-12 28-8 2-18 2-28 2z"/>
  <path pathLength="1" d="M232 112V64M232 82l14-12M232 76l-12-10"/>
  <path pathLength="1" d="M232 68c-20 2-36-8-32-24 3-14 16-20 26-14 4-12 20-16 30-6 12-4 24 6 20 20 10 8 4 24-12 26-10 2-22 0-32-2z"/>
  <path pathLength="1" d="M88 112c4 22 30 34 62 40 22 4 36 14 44 26"/>
  <path pathLength="1" d="M86 112c-6 14-20 22-34 26M70 132c-4 6-10 10-18 12"/>
  <path pathLength="1" d="M90 112c10 12 28 16 50 16 30 0 48 10 60 24"/>
  <path pathLength="1" d="M232 112c-4 22-30 34-62 40-22 4-36 14-44 26"/>
  <path pathLength="1" d="M234 112c6 14 20 22 34 26M250 132c4 6 10 10 18 12"/>
  <path pathLength="1" d="M230 112c-10 12-28 16-50 16-30 0-48 10-60 24"/>
</svg>`;

const BRANCH = `<svg class="branch-art" viewBox="0 30 240 90" aria-hidden="true" style="color:var(--gilt)">
  <g fill="currentColor" opacity=".85">
    <path d="M0 92c40-7 80-4 120-1s80 2 120-8l1 3c-40 11-82 12-122 9S38 90 1 96z"/>
    <path d="M176 89c10-6 18-14 24-24l3 1c-6 11-14 19-25 26z"/>
    <ellipse cx="204" cy="62" rx="7" ry="3" transform="rotate(-40 204 62)"/>
    <ellipse cx="30" cy="86" rx="8" ry="3" transform="rotate(-20 30 86)"/>
    <use href="#parrot" x="86" y="57" width="36" height="55"/>
    <use href="#myna" x="120" y="59" width="34" height="52"/>
  </g>
</svg>`;

function splitChars(text) {
  let i = 0;
  return text.split(' ').map(word =>
    '<span style="white-space:nowrap">' +
    Array.from(word).map(ch => `<span class="ch" style="--i:${i++}">${esc(ch)}</span>`).join('') +
    '</span>').join(' ');
}

function renderStanzas(stanzas, opts = {}) {
  const groups = [];
  stanzas.forEach(s => {
    const last = groups[groups.length - 1];
    if (opts.plain) { groups.push({ lines: s.slice(), solo: false }); return; }
    if (s.length === 1 && last && last.solo && !(opts.moment && (s[0] === opts.moment || last.lines[0] === opts.moment))) last.lines.push(s[0]);
    else groups.push({ lines: s.slice(), solo: s.length === 1 });
  });
  let quoteDepth = 0;
  return groups.map((g, gi) => {
    const isMoment = opts.moment && g.lines.length === 1 && g.lines[0] === opts.moment;
    if (isMoment) {
      return `<div class="stanza moment"><p class="ln" aria-label="${esc(g.lines[0])}"><span aria-hidden="true">${splitChars(g.lines[0])}</span></p></div>`;
    }
    const cls = ['stanza', 'reveal'];
    if (g.solo) cls.push('solo');
    if (opts.closing && gi === groups.length - 1) cls.push('closing-st');
    const lines = g.lines.map((ln, li) => {
      let c = 'ln';
      if (opts.speech) {
        const opens = (ln.match(/\u201C/g) || []).length, closes = (ln.match(/\u201D/g) || []).length;
        if (quoteDepth > 0 || opens > 0) c += ' speech';
        quoteDepth = Math.max(0, quoteDepth + opens - closes);
      }
      return `<p class="${c}" style="--i:${li}">${esc(ln)}</p>`;
    }).join('');
    let html = `<div class="${cls.join(' ')}">${lines}</div>`;
    if (opts.inserts) for (const key in opts.inserts) if (g.lines.some(l => l.includes(key))) html += opts.inserts[key];
    return html;
  }).join('');
}

function renderActs() {
  const host = $('#actRooms');
  host.innerHTML = C.acts.map((a, i) => {
    const id = 'act' + (i + 1);
    const device = i === 0 ? `
      <div class="dict" role="note" aria-label="A dictionary entry for love, with every definition crossed out">
        <p class="dict-word">love</p>
        <p class="dict-meta">/lʌv/<i>noun</i></p>
        <ol class="dict-defs">
          <li><span style="--i:0">a feeling</span></li>
          <li><span style="--i:1">a promise</span></li>
          <li><span style="--i:2">sacrifice</span></li>
          <li><span style="--i:3">finding the one meant to be</span></li>
        </ol>
        <p class="dict-none">No definition found.</p>
      </div>` : '';
    const opts = {};
    if (i === 1) opts.inserts = { 'shelter of love': TREES };
    if (i === 3) { opts.closing = true; opts.moment = a.stanzas.find(s => s.length === 1 && /there was you/i.test(s[0]))?.[0]; }
    const note = i < 3 ? 'The next door is open now.' : 'A window in the library is open now.';
    return `
    <section id="${id}" class="room reading" aria-labelledby="t-${id}">
      <header class="room-head">
        <span class="room-numeral" aria-hidden="true">${ROMAN[i]}</span>
        <h2 class="room-title" id="t-${id}"><span class="sr-only">Act ${ROMAN[i]}: </span>${esc(a.title)}</h2>
      </header>
      ${device}
      <div class="poem">${renderStanzas(a.stanzas, opts)}</div>
      <footer class="room-end">
        ${FLEURON}
        <p class="end-note">${note}</p>
        <button class="btn" type="button" data-action="hall">Back to the library</button>
      </footer>
    </section>`;
  }).join('');
}

function renderBirds() {
  $('#birdsPoem').innerHTML = renderStanzas(C.hindi, { plain: true, speech: true, closing: true, inserts: { 'दो परछाइयाँ': BRANCH } });
}

function renderLetter() {
  const L = C.letter;
  const close = L.closing.split('....');
  const closeHTML = close.length > 1
    ? `${esc(close[0])}....<span class="sub">${heartify(close.slice(1).join('....').trim())}</span>`
    : heartify(L.closing);
  $('#letterPaper').innerHTML =
    `<h2 class="letter-title" id="letterTitle" tabindex="-1">${heartify(L.title)}</h2>` +
    L.body.map(p => `<p class="reveal">${esc(p)}</p>`).join('') +
    `<p class="letter-close reveal">${closeHTML}</p>`;
}

function renderHall() {
  $('#hallTitle').textContent = C.title;
  $('#doors').innerHTML = C.acts.map((a, i) => `
    <button class="door" type="button" data-room="act${i + 1}" id="door-act${i + 1}">
      <span class="door-frame" aria-hidden="true">
        <span class="door-leaf">
          <span class="pnl t"><span class="numeral">${ROMAN[i]}</span></span>
          <span class="pnl b"></span>
          <span class="knob"></span>
          <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        </span>
      </span>
      <span class="door-plaque">${esc(a.title)}</span>
    </button>`).join('');

  // a shelf of book spines, the same every visit
  let seed = 11;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const cols = ['#4E1222', '#2F1B3A', '#1E3A33', '#3A2A16', '#5A2A1E', '#22304A', '#6B1A2E', '#3B1028', '#2A2140'];
  let html = '';
  for (let i = 0; i < 110; i++) {
    const w = 9 + Math.round(rnd() * 14), h = 58 + Math.round(rnd() * 34);
    const lean = rnd() < .05 ? ' lean' : '';
    if (rnd() < .06) { html += `<span style="width:${8 + Math.round(rnd() * 26)}px;flex:none"></span>`; }
    html += `<span class="spine${lean}" style="width:${w}px;height:${h}px;background-color:${cols[Math.floor(rnd() * cols.length)]}"></span>`;
  }
  $('#shelf').innerHTML = html;
}

const elFor = id => id.startsWith('act') ? $('#door-' + id) : $('#nook-' + id);

function updateHall() {
  const next = ORDER.find(id => unlocked(id) && !done[id]);
  ORDER.forEach((id, i) => {
    const el = elFor(id);
    const isUn = unlocked(id), isRead = !!done[id];
    el.classList.toggle('is-locked', !isUn);
    el.classList.toggle('is-read', isRead);
    el.classList.toggle('is-next', id === next);
    el.setAttribute('aria-disabled', String(!isUn));
    if (id.startsWith('act')) {
      const t = `Act ${ROMAN[i]}, ${C.acts[i].title}`;
      el.setAttribute('aria-label', !isUn ? `${t}. Locked until you read Act ${ROMAN[i - 1]}.` : isRead ? `${t}. Read again.` : `${t}. Open this door.`);
    } else {
      const note = $('.nook-note', el);
      if (id === 'birds') note.textContent = !isUn ? 'Opens after the fourth door.' : isRead ? 'Read it again.' : 'Open the window.';
      if (id === 'letter') note.textContent = !isUn ? 'Opens after the story of the two birds.' : isRead ? 'Read it again.' : 'Open the letter.';
    }
  });
  const nActs = ['act1', 'act2', 'act3', 'act4'].filter(id => done[id]).length;
  $('#hallSub').textContent =
    done.letter ? 'Every door is open now. Come back to any of them, any time.' :
    done.birds ? 'One last thing is waiting for you: a letter.' :
    nActs === 4 ? 'The window is open now. Inside, a story about two birds.' :
    nActs === 0 ? 'A poem in four doors. Begin with the first.' :
    'A poem in four doors. The next one is open.';
}

/* ================= toast ================= */
let toastT = 0;
function toast(msg, ms = 2800) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms);
}

/* ================= petals ================= */
const petals = (() => {
  const cv = $('#petals'), ctx = cv.getContext('2d');
  let W = 0, H = 0, density = 0, raf = 0, last = 0, t0 = 0;
  const items = [];

  function petalSprite(c1, c2, c3) {
    const s = document.createElement('canvas'); s.width = 64; s.height = 80;
    const g = s.getContext('2d'); g.translate(32, 40);
    const w = 26, h = 36;
    g.beginPath(); g.moveTo(0, h);
    g.bezierCurveTo(w * 1.05, h * .45, w * .95, -h * .85, w * .18, -h * .92);
    g.quadraticCurveTo(0, -h * .7, -w * .18, -h * .92);
    g.bezierCurveTo(-w * .95, -h * .85, -w * 1.05, h * .45, 0, h);
    g.closePath();
    const gr = g.createLinearGradient(0, h, 0, -h);
    gr.addColorStop(0, c1); gr.addColorStop(.45, c2); gr.addColorStop(1, c3);
    g.fillStyle = gr; g.fill();
    g.globalCompositeOperation = 'source-atop';
    const rg = g.createRadialGradient(-w * .3, -h * .25, 2, 0, 0, w * 1.5);
    rg.addColorStop(0, 'rgba(255,255,255,.3)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = rg; g.fillRect(-32, -40, 64, 80);
    g.strokeStyle = 'rgba(110,15,40,.2)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(0, h * .9); g.quadraticCurveTo(2, 0, 0, -h * .6); g.stroke();
    return s;
  }
  function heartSprite() {
    const s = document.createElement('canvas'); s.width = 48; s.height = 48;
    const g = s.getContext('2d'); g.scale(2, 2);
    const p = new Path2D('M12 21.4 10.6 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5z');
    const gr = g.createLinearGradient(0, 3, 0, 21); gr.addColorStop(0, '#F7A9B6'); gr.addColorStop(1, '#C2304F');
    g.fillStyle = gr; g.fill(p);
    return s;
  }
  function roseSprite() {
    const s = document.createElement('canvas'); s.width = 100; s.height = 100;
    const g = s.getContext('2d'); g.translate(50, 50);
    const layers = [
      { n: 6, r: 46, a: 0, c1: '#7A1430', c2: '#DA5C76' },
      { n: 5, r: 36, a: .55, c1: '#6A0F28', c2: '#CC4463' },
      { n: 5, r: 26, a: .2, c1: '#5A0B22', c2: '#B8324F' },
      { n: 4, r: 16, a: .9, c1: '#4A081C', c2: '#A2253F' }
    ];
    layers.forEach(L => {
      for (let i = 0; i < L.n; i++) {
        g.save(); g.rotate(L.a + i * Math.PI * 2 / L.n);
        const r = L.r;
        g.beginPath(); g.moveTo(0, 0);
        g.bezierCurveTo(r * .95, -r * .1, r * .85, -r * 1.05, 0, -r);
        g.bezierCurveTo(-r * .85, -r * 1.05, -r * .95, -r * .1, 0, 0);
        const gr = g.createLinearGradient(0, 0, 0, -r);
        gr.addColorStop(0, L.c1); gr.addColorStop(1, L.c2);
        g.fillStyle = gr; g.fill();
        g.strokeStyle = 'rgba(55,0,15,.35)'; g.lineWidth = 1; g.stroke();
        g.restore();
      }
    });
    g.strokeStyle = 'rgba(255,175,190,.4)'; g.lineWidth = 1.2; g.beginPath();
    for (let t = 0; t < 12; t += .2) { const rr = 1 + t * .75; g.lineTo(Math.cos(t) * rr, Math.sin(t) * rr); }
    g.stroke();
    return s;
  }
  const SP = {
    petals: [
      petalSprite('#FCE3E8', '#E46F82', '#B8324F'),
      petalSprite('#FFEDEF', '#F09AA8', '#D35670'),
      petalSprite('#F9D3DB', '#D9506B', '#9E1B3A'),
      petalSprite('#FFF3F1', '#F5BCC5', '#E2808F'),
      petalSprite('#F7C8D0', '#C93A5A', '#7E1430')
    ],
    heart: heartSprite(), rose: roseSprite()
  };

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const target = () => Math.round(density * Math.min(64, Math.max(22, W * H / 16000)));
  function make(x, y, burst) {
    const r = Math.random();
    const kind = r < .07 ? 'rose' : r < .17 ? 'heart' : 'petal';
    const s = kind === 'rose' ? 20 + Math.random() * 12 : kind === 'heart' ? 9 + Math.random() * 7 : 11 + Math.random() * 12;
    const sp = kind === 'petal' ? SP.petals[Math.floor(Math.random() * SP.petals.length)] : SP[kind];
    const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 4.5;
    return {
      x, y, s, sp, kind, burst,
      vx: burst ? Math.cos(a) * v : (Math.random() - .5) * .4,
      vy: burst ? Math.sin(a) * v - 2.5 : .5 + Math.random() * .7,
      rot: Math.random() * 6.28, vr: (Math.random() - .5) * .045,
      flip: Math.random() * 6.28, vf: .02 + Math.random() * .045,
      sway: Math.random() * 6.28, swayA: .25 + Math.random() * .6,
      term: .5 + Math.random() * .75 + s / 45, alpha: .78 + Math.random() * .22
    };
  }
  function step(dt, now) {
    const wind = Math.sin(now * .00025) * .35;
    let ambient = 0;
    for (let i = items.length - 1; i >= 0; i--) {
      const p = items[i];
      if (p.fade) { p.alpha -= .045 * dt; if (p.alpha <= 0) { items.splice(i, 1); continue; } }
      p.sway += .02 * dt; p.flip += p.vf * dt; p.rot += p.vr * dt;
      p.vy += (p.term - p.vy) * .025 * dt;
      p.vx += ((wind + Math.sin(p.sway) * p.swayA) - p.vx) * (p.burst ? .02 : .03) * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.y > H + 50 || p.x < -80 || p.x > W + 80) items.splice(i, 1);
      else if (!p.burst && !p.fade) ambient++;
    }
    if (ambient < target() && Math.random() < .14 * dt) items.push(make(Math.random() * W, -30 - Math.random() * 40, false));
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const p of items) {
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.kind === 'petal') ctx.scale(Math.cos(p.flip), 1);
      else if (p.kind === 'heart') ctx.scale(.75 + .25 * Math.cos(p.flip), 1);
      ctx.globalAlpha = p.alpha;
      const h = p.s * p.sp.height / p.sp.width;
      ctx.drawImage(p.sp, -p.s / 2, -h / 2, p.s, h);
      ctx.restore();
    }
  }
  function loop(now) {
    const dt = Math.min(3, (now - last) / 16.67 || 1); last = now;
    step(dt, now); draw();
    if (items.length || density > 0) raf = requestAnimationFrame(loop);
    else { raf = 0; ctx.clearRect(0, 0, W, H); }
  }
  function run() { if (!raf && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(loop); } }
  return {
    resize,
    setDensity(d, fill) {
      density = reduced ? 0 : d;
      if (fill && density > 0) { const n = target(); for (let i = 0; i < n; i++) items.push(make(Math.random() * W, -H * .25 + Math.random() * H * 1.1, false)); }
      run();
    },
    burst(x, y, n = 18) {
      const k = reduced ? Math.ceil(n / 3) : n;
      for (let i = 0; i < k; i++) items.push(make(x + (Math.random() - .5) * 24, y + (Math.random() - .5) * 24, true));
      run();
    },
    storm() { for (let k = 0; k < 6; k++) setTimeout(() => this.burst(W * (k + .5) / 6, H * (.3 + Math.random() * .25), 16), k * 110); },
    fadeAll() { items.forEach(p => { p.fade = true; }); },
    pause() { if (raf) cancelAnimationFrame(raf); raf = 0; },
    run
  };
})();

/* ================= sky (stars, constellation) ================= */
const sky = (() => {
  const cv = $('#sky'), ctx = cv.getContext('2d');
  let W = 0, H = 0, mode = null, raf = 0, stars = [], heart = [], progress = 0, shoot = null, nextShoot = 0;
  function build() {
    const n = Math.round(W * H / 2600);
    stars = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.15 + .25, ph: Math.random() * 6.28, sp: .4 + Math.random() * 1.4 }));
    const wide = W > 1100;
    const cx = wide ? W * .83 : W * .5, cy = H * (wide ? .42 : .4);
    const s = Math.min(wide ? W * .24 : W * .8, H * .55) / 34;
    heart = [];
    const N = 12, jit = [.4, -.6, .5, -.3, .7, -.5, .2, .6, -.4, .3, -.7, .5];
    for (let i = 0; i < N; i++) {
      const t = (i + .5) / N * Math.PI * 2;
      const x = 16 * Math.pow(Math.sin(t), 3) + jit[i];
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t) + jit[(i + 5) % N];
      heart.push({ x: cx + x * s, y: cy - y * s });
    }
  }
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }
  function frame(now) {
    ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      const a = reduced ? .7 : .3 + .7 * (.5 + .5 * Math.sin(now * .001 * s.sp + s.ph));
      ctx.globalAlpha = a; ctx.fillStyle = '#FFF4E6';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }
    if (mode === 'act1' && !reduced) {
      if (!shoot && now > nextShoot) shoot = { x: Math.random() * W * .7 + W * .2, y: Math.random() * H * .35, t: 0 };
      if (shoot) {
        shoot.t += 1;
        const len = 90, k = shoot.t / 50;
        const x = shoot.x - k * 260, y = shoot.y + k * 120;
        const g = ctx.createLinearGradient(x, y, x + len, y - len * .46);
        g.addColorStop(0, 'rgba(255,240,220,.9)'); g.addColorStop(1, 'rgba(255,240,220,0)');
        ctx.globalAlpha = 1 - k; ctx.strokeStyle = g; ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len, y - len * .46); ctx.stroke();
        if (k >= 1) { shoot = null; nextShoot = now + 7000 + Math.random() * 6000; }
      }
    }
    if (mode === 'act3') {
      const N = heart.length, k = Math.min(N, progress * N * 1.08);
      const wide = W > 1100;
      ctx.globalAlpha = wide ? .55 : .26;
      ctx.strokeStyle = '#F0DCAE'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i < Math.floor(k); i++) { const a = heart[i], b = heart[(i + 1) % N]; ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
      const f = k - Math.floor(k);
      if (f > 0 && k < N) { const a = heart[Math.floor(k)], b = heart[(Math.floor(k) + 1) % N]; ctx.moveTo(a.x, a.y); ctx.lineTo(a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f); }
      ctx.stroke();
      for (let i = 0; i < N; i++) {
        const on = i <= k;
        ctx.globalAlpha = on ? (wide ? .95 : .5) : .18;
        ctx.fillStyle = '#FFF1D6';
        ctx.beginPath(); ctx.arc(heart[i].x, heart[i].y, on ? 1.9 : 1.2, 0, 6.283); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    raf = requestAnimationFrame(frame);
  }
  return {
    resize,
    setMode(id) {
      const m = (id === 'act1' || id === 'act3') ? id : null;
      if (m === mode) return;
      mode = m;
      if (raf) cancelAnimationFrame(raf); raf = 0;
      ctx.clearRect(0, 0, W, H);
      if (mode && !document.hidden) { nextShoot = performance.now() + 2500; raf = requestAnimationFrame(frame); }
    },
    set progress(p) { progress = p; },
    pause() { if (raf) cancelAnimationFrame(raf); raf = 0; },
    resume() { if (mode && !raf) raf = requestAnimationFrame(frame); }
  };
})();

/* ================= music ================= */
const music = (() => {
  const a = new Audio();
  let on = true, avail = false, fadeR = 0;
  a.loop = true; a.preload = 'auto';
  a.addEventListener('canplay', () => { avail = true; body.classList.add('has-music'); }, { once: true });
  a.addEventListener('error', () => { avail = false; body.classList.remove('has-music'); });
  a.src = 'music.mp3';
  function fadeTo(v, ms = 1600) {
    cancelAnimationFrame(fadeR);
    const from = a.volume, t0 = performance.now();
    return new Promise(res => {
      const f = now => { const k = Math.min(1, (now - t0) / ms); try { a.volume = from + (v - from) * k; } catch (e) {} if (k < 1) fadeR = requestAnimationFrame(f); else res(); };
      fadeR = requestAnimationFrame(f);
    });
  }
  return {
    start() { if (!on) return; try { a.volume = 0; } catch (e) {} const p = a.play(); if (p && p.then) p.then(() => fadeTo(.55)).catch(() => {}); },
    toggle() {
      on = !on; $('#soundBtn').setAttribute('aria-pressed', String(on));
      if (on) { a.play().catch(() => {}); fadeTo(.55, 800); } else fadeTo(0, 500).then(() => a.pause());
    },
    duck(v) { if (avail && on) fadeTo(v, 700); },
    get on() { return on; }
  };
})();

let mbCtx = null;
function musicBox() {
  if (!music.on) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ac = mbCtx || (mbCtx = new AC()); if (ac.state === 'suspended') ac.resume();
    const master = ac.createGain(); master.gain.value = .2;
    const delay = ac.createDelay(); delay.delayTime.value = .23;
    const fb = ac.createGain(); fb.gain.value = .26;
    const wet = ac.createGain(); wet.gain.value = .35;
    master.connect(ac.destination); master.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(ac.destination);
    const N = { G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99 };
    const tune = [['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['C5', 1], ['B4', 2],
      ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['D5', 1], ['C5', 2],
      ['G4', .75], ['G4', .25], ['G5', 1], ['E5', 1], ['C5', 1], ['B4', 1], ['A4', 2],
      ['F5', .75], ['F5', .25], ['E5', 1], ['C5', 1], ['D5', 1], ['C5', 3]];
    const pluck = (f, t) => [1, 2.01, 3.98].forEach((m, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = f * m;
      const peak = [.5, .16, .05][i];
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + .006);
      g.gain.exponentialRampToValueAtTime(.0001, t + 1.7 - i * .45);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.8);
    });
    let t = ac.currentTime + .1; const beat = .42;
    tune.forEach(([n, d]) => { pluck(N[n] * 2, t); t += d * beat; });
    music.duck(.15);
    setTimeout(() => music.duck(.55), (t - ac.currentTime + 1.5) * 1000);
  } catch (e) {}
}

/* ================= observers ================= */
const revealIO = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    const el = e.target;
    el.classList.add('is-in');
    revealIO.unobserve(el);
    if (el.classList.contains('moment')) {
      const r = el.querySelector('.ln').getBoundingClientRect();
      setTimeout(() => petals.burst(r.left + r.width / 2, r.top + r.height / 2, 26), 900);
    }
  });
}, { threshold: .18, rootMargin: '0px 0px -6% 0px' });

const endIO = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    const room = e.target.closest('.room');
    if (room) markRead(room.id);
  });
}, { threshold: .1 });

let pendingUnlock = null;
function markRead(id) {
  if (done[id] || !ORDER.includes(id)) return;
  done[id] = true; save();
  const n = ORDER[ORDER.indexOf(id) + 1];
  if (n && !preview) pendingUnlock = n;
}

/* ================= navigation ================= */
let current = 'hero', busy = false, depth = -1, hallScroll = 0;

function show(id) {
  if (current === 'hall') hallScroll = window.scrollY;
  $$('.room').forEach(r => r.classList.toggle('is-active', r.id === id));
  body.dataset.room = id;
  body.classList.toggle('in-room', id !== 'hero' && id !== 'hall');
  body.classList.toggle('reading-room', /^(act\d|birds|letter)$/.test(id));
  current = id;
  if (id === 'hall') updateHall();
  if (id === 'letter') resetEnvelope();
  if (id === 'finale') resetCandle();
  window.scrollTo(0, id === 'hall' ? hallScroll : 0);
  petals.fadeAll();
  petals.setDensity(DENSITY[id] || 0, id === 'hero' || id === 'hall');
  sky.setMode(id);
  onScroll();
  const focusEl = id === 'letter' ? $('#seal') : id === 'finale' ? $('#candle') : $(`#${id} h2`);
  if (focusEl && id !== 'hero') {
    if (focusEl.tagName === 'H2') focusEl.setAttribute('tabindex', '-1');
    try { focusEl.focus({ preventScroll: true }); } catch (e) {}
  }
}

async function go(id, { from = null, push = true } = {}) {
  if (busy || id === current) return;
  busy = true;
  const veil = $('#veil');
  if (from) {
    if (from.classList.contains('door')) { from.classList.add('is-opening'); await wait(640); }
    const r = (from.querySelector('.door-frame, .nook-art') || from).getBoundingClientRect();
    veil.style.setProperty('--x', (r.left + r.width / 2) + 'px');
    veil.style.setProperty('--y', (r.top + r.height * .5) + 'px');
    veil.classList.add('on');
    void veil.offsetWidth;
    veil.classList.add('flooding');
    await wait(980);
  } else {
    veil.classList.add('dark', 'on');
    await wait(470);
  }
  if (push) { depth += 1; history.pushState({ room: id, depth }, '', '#' + id); }
  show(id);
  await wait(90);
  veil.classList.remove('on');
  await wait(820);
  veil.classList.remove('flooding', 'dark');
  if (from) from.classList.remove('is-opening');
  busy = false;
  if (id === 'hall') afterHall();
}

function afterHall() {
  if (!pendingUnlock) return;
  const id = pendingUnlock; pendingUnlock = null;
  const el = elFor(id);
  el.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' });
  setTimeout(() => {
    el.classList.add('just-unlocked');
    toast(UNLOCK_MSG[id]);
    setTimeout(() => el.classList.remove('just-unlocked'), 2400);
  }, 600);
}

function backToHall() {
  if (busy) return;
  if (depth > 0 && history.state && history.state.depth === depth) history.go(-depth);
  else go('hall');
}

window.addEventListener('popstate', e => {
  const st = e.state || { room: 'hero', depth: -1 };
  const run = () => {
    if (busy) return setTimeout(run, 120);
    depth = st.depth;
    if (st.room !== current) go(st.room, { push: false });
  };
  run();
});

function tryOpen(id, el) {
  if (busy) return;
  if (!unlocked(id)) {
    el.classList.remove('nudge'); void el.offsetWidth; el.classList.add('nudge');
    toast(LOCK_MSG[id]);
    return;
  }
  go(id, { from: el });
}

/* ================= letter ================= */
function resetEnvelope() {
  $('#envelope').className = 'envelope';
  $('#envStage').classList.remove('gone');
  $('#letterPaper').classList.remove('shown');
  $('#letterEnd').classList.remove('shown');
}
async function openEnvelope() {
  const env = $('#envelope');
  if (env.classList.contains('open')) return;
  env.classList.add('open');
  await wait(1250);
  env.classList.add('flap-back', 'rise');
  await wait(1250);
  const r = env.getBoundingClientRect();
  petals.burst(r.left + r.width / 2, r.top, 22);
  await wait(350);
  $('#envStage').classList.add('gone');
  $('#letterPaper').classList.add('shown');
  $('#letterEnd').classList.add('shown');
  window.scrollTo(0, 0);
  $$('#letterPaper .reveal').forEach(el => revealIO.observe(el));
  try { $('#letterTitle').focus({ preventScroll: true }); } catch (e) {}
}

/* ================= finale ================= */
function resetCandle() {
  $('#candle').classList.remove('out');
  $('#candle').disabled = false;
  $('#finalePrompt').style.display = '';
  $('#finalePrompt').style.opacity = '';
  $('#finaleMsg').classList.remove('shown');
}
async function blowOut() {
  const c = $('#candle');
  if (c.classList.contains('out')) return;
  c.classList.add('out'); c.disabled = true;
  $('#finalePrompt').style.opacity = '0';
  musicBox();
  await wait(900);
  petals.storm();
  await wait(500);
  $('#finalePrompt').style.display = 'none';
  $('#finaleMsg').classList.add('shown');
}

/* ================= scroll ================= */
let scrollQueued = false;
function onScroll() {
  if (scrollQueued) return;
  scrollQueued = true;
  requestAnimationFrame(() => {
    scrollQueued = false;
    const max = document.documentElement.scrollHeight - innerHeight;
    const p = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
    $('#ribbon').style.setProperty('--p', p.toFixed(4));
    if (current === 'act2') $('#backdrop').style.setProperty('--dawn', (p * .95).toFixed(3));
    sky.progress = p;
  });
}

/* ================= wiring ================= */
function init() {
  renderHall(); renderActs(); renderBirds(); renderLetter();
  $$('.reveal, .dict, .art, .moment').forEach(el => revealIO.observe(el));
  $$('.room-end').forEach(el => endIO.observe(el));
  endIO.observe($('#letterEnd'));

  history.replaceState({ room: 'hero', depth: -1 }, '', location.pathname + location.search);

  petals.resize(); sky.resize();
  petals.setDensity(DENSITY.hero, true);

  const hero = $('#hero');
  const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  Promise.race([fontsReady, new Promise(r => setTimeout(r, 2200))]).then(() => requestAnimationFrame(() => hero.classList.add('is-written')));

  $('#openLibrary').addEventListener('click', e => { e.stopPropagation(); music.start(); go('hall', { from: e.currentTarget }); });
  hero.addEventListener('click', e => { if (!e.target.closest('button')) petals.burst(e.clientX, e.clientY, 10); });

  $('#doors').addEventListener('click', e => { const d = e.target.closest('.door'); if (d) tryOpen(d.dataset.room, d); });
  $$('.nook').forEach(n => n.addEventListener('click', () => tryOpen(n.dataset.room, n)));

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-action]');
    if (!b) return;
    if (b.dataset.action === 'hall') backToHall();
    if (b.dataset.action === 'finale') go('finale', { from: b });
  });
  $('#backBtn').addEventListener('click', backToHall);
  $('#soundBtn').addEventListener('click', () => music.toggle());
  $('#seal').addEventListener('click', openEnvelope);
  $('#candle').addEventListener('click', blowOut);
  $('#relight').addEventListener('click', () => { resetCandle(); $('#candle').focus(); });

  document.addEventListener('keydown', e => { if (e.key === 'Escape' && body.classList.contains('in-room')) backToHall(); });
  window.addEventListener('scroll', onScroll, { passive: true });
  let rz = 0;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { petals.resize(); sky.resize(); }, 150); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { petals.pause(); sky.pause(); }
    else { petals.run(); sky.resume(); }
  });
}
init();
})();

</script>
